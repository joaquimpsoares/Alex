<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123053">
    <meta name="description" content="Contacto de emergencia de Alex.">
    <title>Alex — Contacto de emergencia</title>
    <style>
        :root {
            color-scheme: light;
            --navy: #123053;
            --navy-deep: #0a1d33;
            --blue: #1d65ad;
            --sky: #d9ecfb;
            --paper: #ffffff;
            --ink: #172536;
            --muted: #5c6b7a;
            --line: #d9e2eb;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--navy-deep);
        }

        body {
            min-height: 100svh;
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 16% 10%, rgba(82, 157, 224, 0.28), transparent 30rem),
                linear-gradient(155deg, #173c65 0%, var(--navy-deep) 72%);
            display: grid;
            place-items: center;
            padding: 1rem;
        }

        main {
            width: min(100%, 29rem);
        }

        .card {
            overflow: hidden;
            background: var(--paper);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1.5rem;
            box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.32);
        }

        .photo-wrap {
            position: relative;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: var(--sky);
        }

        .photo-wrap::after {
            content: "";
            position: absolute;
            inset: auto 0 0;
            height: 45%;
            background: linear-gradient(transparent, rgba(9, 27, 48, 0.72));
            pointer-events: none;
        }

        .photo {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center 63%;
        }

        .identity {
            position: absolute;
            z-index: 1;
            left: 1.25rem;
            right: 1.25rem;
            bottom: 1.1rem;
            color: white;
        }

        .identity p {
            margin: 0 0 0.25rem;
            font-size: 0.82rem;
            font-weight: 750;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.86;
        }

        .identity h1 {
            margin: 0;
            font-size: clamp(2.25rem, 10vw, 3.25rem);
            line-height: 0.95;
            letter-spacing: -0.045em;
        }

        .content {
            padding: 1.5rem;
        }

        .intro {
            margin: 0 0 1.35rem;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.55;
        }

        .contacts {
            display: grid;
            gap: 0.85rem;
        }

        .contact {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1rem 1rem 1.1rem;
            border: 1px solid var(--line);
            border-radius: 1rem;
            background: #f8fafc;
        }

        .contact-name {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 760;
        }

        .contact-role,
        .contact-number {
            margin: 0.15rem 0 0;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.35;
        }

        .call-button {
            min-width: 6.3rem;
            min-height: 3.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem 1rem;
            border-radius: 0.8rem;
            color: white;
            background: var(--blue);
            font-size: 1rem;
            font-weight: 780;
            text-decoration: none;
            box-shadow: 0 0.35rem 0.85rem rgba(29, 101, 173, 0.24);
            transition: transform 160ms ease, background-color 160ms ease;
            -webkit-tap-highlight-color: transparent;
        }

        .call-button:hover {
            background: #17558f;
        }

        .call-button:active {
            transform: translateY(1px);
        }

        .call-button:focus-visible {
            outline: 0.2rem solid #f2a15f;
            outline-offset: 0.2rem;
        }

        .phone-icon {
            width: 1.15rem;
            height: 1.15rem;
            fill: currentColor;
            flex: none;
        }

        .note {
            margin: 1.25rem 0 0;
            text-align: center;
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.45;
        }

        @media (max-width: 23rem) {
            body {
                padding: 0;
                place-items: start center;
                background: var(--paper);
            }

            .card {
                min-height: 100svh;
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .content {
                padding: 1.25rem 1rem 1.5rem;
            }

            .contact {
                gap: 0.7rem;
                padding-left: 0.9rem;
                padding-right: 0.75rem;
            }

            .call-button {
                min-width: 5.7rem;
                padding-inline: 0.8rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .call-button {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <article class="card" aria-labelledby="page-title">
            <div class="photo-wrap">
                <img class="photo" src="alex-emergency.jpg" alt="Alex delante de una casa con flores">
                <div class="identity">
                    <p>Contacto de emergencia</p>
                    <h1 id="page-title">Alex</h1>
                </div>
            </div>

            <div class="content">
                <p class="intro">Si Alex necesita ayuda, por favor llama a uno de sus padres.</p>

                <div class="contacts" aria-label="Contactos de emergencia">
                    <section class="contact" aria-labelledby="contact-joaquim">
                        <div>
                            <p class="contact-name" id="contact-joaquim">Joaquim Soares</p>
                            <p class="contact-role">Padre</p>
                            <p class="contact-number">+34 600 032 256</p>
                        </div>
                        <a class="call-button" href="tel:+34600032256" aria-label="Llamar a Joaquim Soares, padre de Alex">
                            <svg class="phone-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/>
                            </svg>
                            Llamar
                        </a>
                    </section>

                    <section class="contact" aria-labelledby="contact-esperanza">
                        <div>
                            <p class="contact-name" id="contact-esperanza">Esperanza Marquez</p>
                            <p class="contact-role">Madre</p>
                            <p class="contact-number">+34 637 391 679</p>
                        </div>
                        <a class="call-button" href="tel:+34637391679" aria-label="Llamar a Esperanza Marquez, madre de Alex">
                            <svg class="phone-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/>
                            </svg>
                            Llamar
                        </a>
                    </section>
                </div>

                <p class="note">Toca “Llamar” para iniciar la llamada desde tu teléfono.</p>
            </div>
        </article>
    </main>
</body>
</html>
